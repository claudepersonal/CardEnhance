name: Verify 1Password Codex credential

on:
  push:
    branches:
      - codex/setup-coordinator-workflow

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Load Codex key from 1Password
        id: load
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_API_KEY: op://CardEnhance CI/Codex-OpenAI/password
      - name: Check OpenAI authentication without printing the key
        env:
          OPENAI_API_KEY: ${{ steps.load.outputs.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("OpenAI authentication HTTP", response.status)
              assert response.status == 200
          PY
